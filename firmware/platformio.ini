; PlatformIO Configuration for PopsTracker Dog Collar
; LILYGO T-A7670G R2 with ESP32

[env:lilygo-t-a7670]
platform = espressif32
board = esp32dev
framework = arduino

; Upload settings
upload_speed = 921600
monitor_speed = 115200

; Board configuration
board_build.mcu = esp32
board_build.f_cpu = 240000000L

; Partition scheme for OTA updates
board_build.partitions = default.csv

; Library dependencies
lib_deps =
    ; TinyGSM for cellular modem (A7670 uses SIM7600 compatible driver)
    vshymanskyy/TinyGSM@^0.11.7
    ; GPS parsing
    mikalhart/TinyGPSPlus@^1.0.3
    ; ADXL345 accelerometer
    adafruit/Adafruit ADXL345@^1.3.2
    adafruit/Adafruit Unified Sensor@^1.1.14
    ; OLED Display
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
    ; JSON handling
    bblanchon/ArduinoJson@^7.0.4
    ; HTTP Client
    arduino-libraries/ArduinoHttpClient@^0.5.0

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM=0
    ; Modem type for TinyGSM (SIM7600 driver is compatible with A7670)
    -DTINY_GSM_MODEM_SIM7600
    -DTINY_GSM_RX_BUFFER=1024
    ; Debug options
    -DPOPS_DEBUG=1

[platformio]
default_envs = lilygo-t-a7670
